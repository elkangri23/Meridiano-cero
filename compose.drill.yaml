# Compose SOLO para el simulacro de desastre T6-05: únicamente la base de
# datos del drill, en su propio volumen y su propia red. La API y la web
# del drill corren como en el stack E2E (contenedor node:24 con el repo
# montado, ver scripts/drill-setup.sh y scripts/drill-build.sh).
# Sin red freellmapi, sin correo, sin proveedor real. Nunca apuntar este
# compose al volumen de producción ni a la red de producción.
services:
  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    container_name: meridiano-drill-db
    environment:
      POSTGRES_USER: meridiano_owner
      POSTGRES_DB: meridiano
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - meridiano_drill_data:/var/lib/postgresql
      - ./infra/docker/init-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - admin_password
      - app_password
    ports:
      - "127.0.0.1:15440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridiano_owner -d meridiano"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
secrets:
  admin_password:
    file: ./.drill/admin-password
  app_password:
    file: ./.drill/app-password
volumes:
  meridiano_drill_data:
