name: meridiano-cero-dev
services:
  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: meridiano_owner
      POSTGRES_DB: meridiano
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/init-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - admin_password
      - app_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridiano_owner -d meridiano"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
secrets:
  admin_password:
    file: ${DB_ADMIN_SECRET_FILE:-./.local-secrets/admin-password}
  app_password:
    file: ${DB_APP_SECRET_FILE:-./.local-secrets/app-password}
volumes:
  postgres_data:
