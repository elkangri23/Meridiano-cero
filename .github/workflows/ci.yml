name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build, types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Evaluate AI contracts (deterministic mock, no model)
        run: pnpm eval:ai --mock

      - name: Verify guards
        run: pnpm verify:guards

      - name: Check imports
        run: pnpm check:imports

      - name: Secret scan
        run: |
          if grep -rn "SECRET\|PASSWORD\|API_KEY" --include="*.ts" --include="*.js" --include="*.json" . | grep -v node_modules | grep -v "process.env" | grep -v "examples" | grep -v "\.example" | grep -v "placeholder"; then
            echo "Posibles secretos encontrados"
            exit 1
          fi

      - name: Verify docs
        run: python3 scripts/verify_docs.py